name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      - name: Check release tag matches project version
        run: |
          python -c "import os, tomllib, det; from pathlib import Path; version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; tag = os.environ['GITHUB_REF_NAME'].removeprefix('v'); assert tag == version, f'Release tag {tag!r} does not match project version {version!r}'; assert det.__version__ == version, f'det.__version__ {det.__version__!r} does not match project version {version!r}'"

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish approved release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/det-core
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
