name: "🐛 Bug Report"
description: "File a reproducible bug report to help improve det"
title: "fix: [Short description of bug]"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running pipeline X, DataFusion throws an error..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the problem."
      placeholder: |
        1. det init test_ws
        2. Create pipeline.yaml with ...
        3. Run 'det run my_pipeline'
        4. See error: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Traceback or Console Output"
      description: "Paste complete error traceback or terminal logs here."
      render: shell
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "OS (e.g. Windows 11, Ubuntu 24.04, macOS 15) and Python version (e.g. Python 3.14.0)."
      placeholder: "Windows 11, Python 3.14.0, det-core 0.2.0"
    validations:
      required: true

