id: 7c8e9f1a-2b3c-4d5e-6f7a-8b9c0d1e2f3a
name: summarize
folder: demo
catalog: default.yaml
description: Use registered connections, build steps, and publish your results.
steps:
- id: 8d9e0f1a-2b3c-4d5e-6f7a-8b9c0d1e2f3b
  name: totals
  description: Aggregate customer sales totals from daily orders.
  sql: "WITH valid_sales AS (\n  SELECT customer_id, (quantity * unit_price) AS amount\n\
    \  FROM Orders_Daily\n  WHERE quantity > 0\n)\nSELECT\n  customer_id,\n  ROUND(SUM(amount),\
    \ 2) AS total_sales_usd,\n  COUNT(*) AS order_count\nFROM valid_sales\nGROUP BY\
    \ customer_id\nORDER BY total_sales_usd DESC\n"
  destinations:
  - Customer_Totals_CSV
  keep_temporary: true
