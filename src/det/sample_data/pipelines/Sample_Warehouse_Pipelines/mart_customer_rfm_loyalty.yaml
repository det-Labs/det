id: cb66f6b8-567e-460a-b273-023a166ea214
name: mart_customer_rfm_loyalty
folder: Sample_Warehouse_Pipelines
catalog: sample_warehouse.yaml
description: '3-stage RFM loyalty pipeline: aggregates order history, calculates NTILE(5)
  scoring distributions, and synthesizes loyalty tiers to CSV.'
steps:
- id: 223dbc68-f812-4b61-9ffa-c0b31fd4d562
  name: customer_rfm_aggregates
  description: Compute customer order frequency, monetary spend, and average basket
    sizes.
  sql: "SELECT\n  o.customer_id,\n  COUNT(DISTINCT o.order_id) AS order_frequency,\n\
    \  ROUND(SUM(o.quantity * o.unit_price * COALESCE(fx.rate_to_usd, 1.0) * (1.0\
    \ - o.discount_pct)), 2) AS monetary_spend,\n  ROUND(AVG(o.quantity * o.unit_price\
    \ * COALESCE(fx.rate_to_usd, 1.0) * (1.0 - o.discount_pct)), 2) AS avg_basket_size\n\
    FROM raw_orders o\nLEFT JOIN raw_exchange_rates fx ON o.currency = fx.currency_code\n\
    WHERE o.order_status = 'Completed'\nGROUP BY o.customer_id"
  destinations: []
  keep_temporary: true
- id: b4f1601f-e1ce-484e-a79e-5ae775a11284
  name: rfm_quintile_scoring
  description: Assign quintiles (1-5) across frequency and monetary dimensions using
    window NTILE.
  sql: "SELECT\n  customer_id,\n  order_frequency,\n  monetary_spend,\n  avg_basket_size,\n\
    \  NTILE(5) OVER (ORDER BY order_frequency ASC) AS frequency_score,\n  NTILE(5)\
    \ OVER (ORDER BY monetary_spend ASC) AS monetary_score\nFROM customer_rfm_aggregates"
  destinations: []
  keep_temporary: true
- id: 649917da-4498-4243-bbf0-3471093d7764
  name: curated_rfm_export
  description: Join RFM scores with customer demographics from CSV, segment into cohorts,
    and export to CSV.
  sql: "SELECT\n  c.customer_id,\n  c.first_name || ' ' || c.last_name AS customer_name,\n\
    \  c.email,\n  c.city,\n  c.region,\n  c.loyalty_status AS base_loyalty_tier,\n\
    \  r.order_frequency,\n  r.monetary_spend,\n  r.avg_basket_size,\n  r.frequency_score,\n\
    \  r.monetary_score,\n  (r.frequency_score + r.monetary_score) AS composite_rfm_score,\n\
    \  CASE\n    WHEN (r.frequency_score + r.monetary_score) >= 9 THEN 'Champion'\n\
    \    WHEN (r.frequency_score + r.monetary_score) >= 7 THEN 'Loyal Customer'\n\
    \    WHEN (r.frequency_score + r.monetary_score) >= 5 THEN 'Potential Loyalist'\n\
    \    WHEN (r.frequency_score + r.monetary_score) >= 3 THEN 'Promising'\n    ELSE\
    \ 'Needs Attention'\n  END AS predicted_rfm_segment\nFROM raw_customers c\nINNER\
    \ JOIN rfm_quintile_scoring r ON c.customer_id = r.customer_id\nORDER BY composite_rfm_score\
    \ DESC, monetary_spend DESC"
  destinations:
  - dw_rfm_segments_csv
  keep_temporary: true
