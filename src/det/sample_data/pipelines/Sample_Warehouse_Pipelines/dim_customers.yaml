id: 9bd8e9e4-e58e-4e1a-9e1a-5f4107098489
name: dim_customers
folder: Sample_Warehouse_Pipelines
catalog: sample_warehouse.yaml
description: 'Dimensional warehouse table: aggregates customer lifetime orders, spend,
  and value tier, writing idempotently to CSV destination.'
steps:
- id: 707a30f0-ea1b-43d2-81c6-b7fb710519b3
  name: aggregate_customer_history
  description: Compute total orders, spend, and basket sizes.
  sql: "WITH customer_orders AS (\n  SELECT\n    o.customer_id,\n    COUNT(DISTINCT\
    \ o.order_id) AS total_orders,\n    ROUND(SUM(o.quantity * o.unit_price * COALESCE(fx.rate_to_usd,\
    \ 1.0) * (1.0 - o.discount_pct)), 2) AS total_spend_usd,\n    ROUND(AVG(o.quantity\
    \ * o.unit_price * COALESCE(fx.rate_to_usd, 1.0) * (1.0 - o.discount_pct)), 2)\
    \ AS avg_order_value_usd,\n    MIN(o.order_date) AS first_order_date,\n    MAX(o.order_date)\
    \ AS latest_order_date\n  FROM raw_orders o\n  LEFT JOIN raw_exchange_rates fx\
    \ ON o.currency = fx.currency_code\n  WHERE o.order_status != 'Cancelled'\n  GROUP\
    \ BY o.customer_id\n)\nSELECT\n  c.customer_id,\n  c.first_name,\n  c.last_name,\n\
    \  c.email,\n  c.city,\n  c.state,\n  c.region,\n  c.signup_date,\n  COALESCE(co.total_orders,\
    \ 0) AS lifetime_orders,\n  COALESCE(co.total_spend_usd, 0.0) AS lifetime_spend_usd,\n\
    \  COALESCE(co.avg_order_value_usd, 0.0) AS avg_order_value_usd,\n  co.first_order_date,\n\
    \  co.latest_order_date,\n  CASE\n    WHEN COALESCE(co.total_spend_usd, 0.0) >=\
    \ 1500.0 THEN 'VIP Platinum'\n    WHEN COALESCE(co.total_spend_usd, 0.0) >= 800.0\
    \ THEN 'Gold Tier'\n    WHEN COALESCE(co.total_spend_usd, 0.0) >= 300.0 THEN 'Silver\
    \ Tier'\n    ELSE 'Standard'\n  END AS customer_value_segment\nFROM raw_customers\
    \ c\nLEFT JOIN customer_orders co ON c.customer_id = co.customer_id"
  destinations:
  - dw_dim_customers_csv
  keep_temporary: true
