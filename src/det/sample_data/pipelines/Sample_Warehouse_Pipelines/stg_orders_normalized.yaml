id: 04810dee-aad8-456b-9199-236721f777f3
name: stg_orders_normalized
folder: Sample_Warehouse_Pipelines
catalog: sample_warehouse.yaml
description: 'Staging pipeline: normalizes multi-file partitioned orders and converts
  multi-currency sales to USD.'
steps:
- id: aaaa824d-3e19-4f0c-a6a2-6c5d5bc5a39a
  name: currency_converted_orders
  description: Join exchange rates from Excel and compute gross, discount, and net
    USD amounts.
  sql: "WITH converted AS (\n  SELECT\n    o.order_id,\n    o.customer_id,\n    o.product_id,\n\
    \    o.store_id,\n    o.channel,\n    o.order_date,\n    o.currency,\n    o.quantity,\n\
    \    o.unit_price,\n    o.discount_pct,\n    COALESCE(fx.rate_to_usd, 1.0) AS\
    \ rate_to_usd,\n    ROUND(o.unit_price * COALESCE(fx.rate_to_usd, 1.0), 2) AS\
    \ unit_price_usd,\n    ROUND(o.quantity * o.unit_price * COALESCE(fx.rate_to_usd,\
    \ 1.0), 2) AS gross_amount_usd,\n    ROUND(o.quantity * o.unit_price * COALESCE(fx.rate_to_usd,\
    \ 1.0) * o.discount_pct, 2) AS discount_amount_usd,\n    ROUND(o.quantity * o.unit_price\
    \ * COALESCE(fx.rate_to_usd, 1.0) * (1.0 - o.discount_pct), 2) AS net_amount_usd,\n\
    \    o.order_status\n  FROM raw_orders o\n  LEFT JOIN raw_exchange_rates fx ON\
    \ o.currency = fx.currency_code\n)\nSELECT\n  order_id,\n  customer_id,\n  product_id,\n\
    \  store_id,\n  channel,\n  order_date,\n  currency,\n  quantity,\n  unit_price_usd,\n\
    \  gross_amount_usd,\n  discount_amount_usd,\n  net_amount_usd,\n  order_status,\n\
    \  AVG(net_amount_usd) OVER (PARTITION BY channel) AS avg_channel_order_value,\n\
    \  CASE\n    WHEN net_amount_usd >= AVG(net_amount_usd) OVER (PARTITION BY channel)\
    \ THEN true\n    ELSE false\n  END AS is_above_channel_avg\nFROM converted"
  destinations: []
  keep_temporary: true
