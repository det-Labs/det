id: 420fee64-93f0-4d6c-84f7-3200bcb0b2b0
name: stg_customers_cleaned
folder: Sample_Warehouse_Pipelines
catalog: sample_warehouse.yaml
description: 'Staging pipeline: cleans and standardizes customer names, emails, and
  regional ranks.'
steps:
- id: 113ee685-69e4-4307-8fd7-05a373753ecc
  name: clean_customers
  description: Normalize casing, trim whitespace, and clean demographic attributes.
  sql: "WITH customer_clean AS (\n  SELECT\n    customer_id,\n    UPPER(SUBSTR(first_name,\
    \ 1, 1)) || LOWER(SUBSTR(first_name, 2)) AS first_name,\n    UPPER(SUBSTR(last_name,\
    \ 1, 1)) || LOWER(SUBSTR(last_name, 2)) AS last_name,\n    LOWER(email) AS email,\n\
    \    phone,\n    city,\n    state,\n    region,\n    signup_date,\n    loyalty_status,\n\
    \    credit_balance\n  FROM raw_customers\n)\nSELECT\n  customer_id,\n  first_name,\n\
    \  last_name,\n  first_name || ' ' || last_name AS full_name,\n  email,\n  phone,\n\
    \  city,\n  state,\n  region,\n  signup_date,\n  loyalty_status,\n  credit_balance,\n\
    \  DENSE_RANK() OVER (PARTITION BY region ORDER BY credit_balance DESC) AS regional_credit_rank\n\
    FROM customer_clean"
  destinations: []
  keep_temporary: true
