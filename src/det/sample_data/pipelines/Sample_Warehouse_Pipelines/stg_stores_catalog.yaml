id: c1de41c7-ef4d-4ea3-b18b-840372357b88
name: stg_stores_catalog
folder: Sample_Warehouse_Pipelines
catalog: sample_warehouse.yaml
description: 'Staging pipeline: parses XML store registry, casts string dimensions,
  and classifies floor formats.'
steps:
- id: 4633b1df-86a0-4e8b-a439-01101dd0b64c
  name: parsed_stores
  description: Parse XML store nodes and compute operational store age.
  sql: "SELECT\n  store_id,\n  store_type,\n  name AS store_name,\n  city,\n  state,\n\
    \  region,\n  CAST(sqft AS BIGINT) AS sqft,\n  CAST(opened_year AS BIGINT) AS\
    \ opened_year,\n  (2026 - CAST(opened_year AS BIGINT)) AS store_age_years,\n \
    \ CASE\n    WHEN CAST(sqft AS BIGINT) >= 60000 THEN 'Megastore'\n    WHEN CAST(sqft\
    \ AS BIGINT) >= 35000 THEN 'Standard'\n    ELSE 'Boutique'\n  END AS store_size_tier,\n\
    \  manager\nFROM raw_stores"
  destinations: []
  keep_temporary: true
