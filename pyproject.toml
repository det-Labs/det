[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "det-core"
version = "0.2.1"
description = "Fast, local-first SQL ETL workspace and pipeline orchestration engine powered by Apache DataFusion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Saurabh Rai", email = "saurabhr2@gmail.com" },
    { name = "det-Labs" },
]
maintainers = [
    { name = "Saurabh Rai", email = "saurabhr2@gmail.com" },
]
keywords = [
    "etl",
    "det",
    "dbt-alternative",
    "sql",
    "data-engineering",
    "data-pipeline",
    "datafusion",
    "apache-arrow",
    "parquet",
    "delta-lake",
    "duckdb-alternative",
    "analytics-engineering",
    "data-orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "datafusion>=55.0.0,<56",
    "pyarrow>=22",
    "pydantic",
    "PyYAML",
    "fastexcel>=0.20.0",
    "openpyxl>=3.1.0",
    "deltalake>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "build>=1.0.0",
    "twine>=7.0.0",
]

[project.scripts]
det = "det.cli:main"

[project.urls]
Homepage = "https://github.com/det-Labs/det"
Repository = "https://github.com/det-Labs/det"
Documentation = "https://github.com/det-Labs/det/wiki"
Showcase = "https://det-labs.github.io/det/demo.html"
Issues = "https://github.com/det-Labs/det/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/det"]
