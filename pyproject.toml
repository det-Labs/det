[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "det"
version = "0.1.0"
description = "A modular, Python-first data engineering framework."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Saurabh Rai", email = "saurabhr2@gmail.com" }
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "sqlglot>=23.0.0",
    "typer>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "filelock>=3.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
det = "det.cli:main"
det-gui = "det.gui:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.pytest.ini_options]
testpaths = ["tests"]
