[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "det-core"
version = "0.3.1"
description = "Fast, local-first SQL ETL workspace and pipeline orchestration engine powered by DuckDB 2.0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "Saurabh Rai", email = "saurabhr2@gmail.com" },
    { name = "det-Labs" },
]
maintainers = [
    { name = "Saurabh Rai", email = "saurabhr2@gmail.com" },
]
keywords = [
    "etl",
    "det",
    "sql",
    "data-engineering",
    "data-pipeline",
    "duckdb",
    "apache-arrow",
    "parquet",
    "delta-lake",
    "analytics-engineering",
    "data-orchestration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=2.0.0",
    "pyyaml>=6.0.0",
    "pyarrow>=22",
    "openpyxl>=3.1.0",
    "deltalake>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
det = "det.cli:main"

[project.urls]
Homepage = "https://github.com/det-Labs/det"
Repository = "https://github.com/det-Labs/det"
Issues = "https://github.com/det-Labs/det/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
