[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "det-core"
version = "0.1.0a1"
description = "A modular, Python-first data engineering framework by det Labs."
readme = "README.md"
requires-python = ">=3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "det Labs", email = "saurabhr2@gmail.com" }
]
keywords = ["data-engineering", "catalog", "parquet", "polars", "pyarrow", "schema", "cli", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "sqlglot>=23.0.0",
    "typer>=0.12.0",
    "ruamel.yaml>=0.18.0",
    "filelock>=3.13.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/saurabhr2/det"
Repository = "https://github.com/saurabhr2/det"
Issues = "https://github.com/saurabhr2/det/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
det = "det.cli:main"
det-gui = "det.gui:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"det.gui" = ["static/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.pytest.ini_options]
testpaths = ["tests"]
